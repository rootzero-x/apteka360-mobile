<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apteka 360 — ulanish yo‘q</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, Roboto, sans-serif; background:#f3f7f6; color:#0f172a;
         padding: 24px; padding-top: calc(24px + env(safe-area-inset-top)); }
  .card { max-width: 360px; width:100%; text-align:center; }
  .icon { width:88px; height:88px; margin:0 auto 20px; border-radius:24px; background:#e0f2ef;
          display:flex; align-items:center; justify-content:center; }
  h1 { font-size:22px; margin:0 0 10px; }
  p { font-size:15px; line-height:1.5; color:#475569; margin:0 0 24px; }
  button { width:100%; border:0; border-radius:14px; padding:14px 18px; font-size:16px; font-weight:600;
           background:#0f766e; color:#fff; cursor:pointer; }
  button:active { opacity:.85; }
  .hint { font-size:13px; color:#94a3b8; margin-top:16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Internet bilan aloqa yo‘q</h1>
    <p>Apteka 360 serveriga ulanib bo‘lmadi. Wi‑Fi yoki mobil internetni tekshiring va qayta urinib ko‘ring.</p>
    <button id="retry" type="button">Qayta urinish</button>
    <div class="hint" id="hint">Internet qaytganda ilova o‘zi qayta yuklanadi.</div>
  </div>
<script>
  var APP_URL = 'https://apteka.agrom24.uz/';
  function retry() {
    var b = document.getElementById('retry');
    b.disabled = true; b.textContent = 'Ulanmoqda…';
    setTimeout(function () { location.replace(APP_URL); }, 150);
  }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
</body>
</html>
